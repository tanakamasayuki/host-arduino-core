sentence=Host I2C that initializes successfully with no device present, plus transaction-level observation hooks.
paragraph=Links and runs on host-arduino-core. Without a hook, endTransmission() reports an address NACK and requestFrom() returns 0 bytes. Register a write/read hook to put a library-side device model on the bus. See cores/host/HostBus.h for the GPIO half of the same port.
