sentence=Host SPI with a byte-level observation hook.
paragraph=Links and runs on host-arduino-core. Transferred bytes are handed to a transfer hook whose return value becomes the byte the sketch reads back, so a library can keep its own device model and watch the whole conversation. See cores/host/HostBus.h for the GPIO half of the same port.
