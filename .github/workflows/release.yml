name: Build and Release Host Arduino Core

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without v). If empty uses tag name without v'
        required: false

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG=${GITHUB_REF_NAME:-$(git describe --tags --abbrev=0)}
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release preparation
        run: |
          set -euo pipefail
          VER=${{ steps.ver.outputs.version }}
          python3 scripts/prepare_release.py --version "$VER"

      - name: Build package and update index
        run: |
          set -euo pipefail
          VER=${{ steps.ver.outputs.version }}
          python3 scripts/build_package.py --version "$VER" --repo "${{ github.repository }}"

      - name: Build release body from CHANGELOG
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          version = "${{ steps.ver.outputs.version }}"
          section_header = f"## {version}"
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()

          try:
              start = changelog.index(section_header) + 1
          except ValueError as exc:
              raise SystemExit(f"Version section {section_header} not found in CHANGELOG.md") from exc

          end = len(changelog)
          for i in range(start, len(changelog)):
              if changelog[i].startswith("## "):
                  end = i
                  break

          body_lines = changelog[start:end]
          while body_lines and not body_lines[0].strip():
              body_lines.pop(0)
          while body_lines and not body_lines[-1].strip():
              body_lines.pop()

          if not body_lines:
              body_lines = [
                  "- (EN) No user-facing changes recorded.",
                  "- (JA) ユーザー向け変更の記録はありません。",
              ]

          Path("release_body.md").write_text("\n".join(body_lines) + "\n", encoding="utf-8")
          PY

      - name: Commit release changes back to repository
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git fetch origin main:refs/remotes/origin/main || true
          git add CHANGELOG.md package_index.json
          if git diff --staged --quiet; then
            echo "No release changes to commit"
          else
            git commit -m "chore(release): v${{ steps.ver.outputs.version }}"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:main
          fi

      - name: Ensure tag exists
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          VER=${{ steps.ver.outputs.version }}
          TAG=v$VER
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$TAG"
          fi

      - name: Publish package to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./package
          publish_branch: gh-pages

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          body_path: release_body.md
          generate_release_notes: false
          files: |
            host-arduino-core-${{ steps.ver.outputs.version }}.zip
            package_index.json

      - name: Trigger merged package index update
        env:
          TARGET_REPO_TOKEN: ${{ secrets.LANG_SHIP_ARDUINO_CORE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${TARGET_REPO_TOKEN:-}" ]; then
            echo "LANG_SHIP_ARDUINO_CORE_PAT is not set"
            exit 1
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TARGET_REPO_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/tanakamasayuki/lang-ship-arduino-core/dispatches" \
            -d '{"event_type":"package-index-updated","client_payload":{"source_repo":"${{ github.repository }}","version":"${{ steps.ver.outputs.version }}"}}'
