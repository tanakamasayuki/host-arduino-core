name: Host tests (manual)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install SDL2 (headless LovyanGFX / M5GFX backend)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Install SDL2 and OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 openssl

      - name: Add Homebrew include/lib paths (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "CPATH=$(brew --prefix sdl2)/include:$(brew --prefix openssl)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix sdl2)/lib:$(brew --prefix openssl)/lib" >> "$GITHUB_ENV"

      - name: Disable Windows Defender real-time scan (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install SDL2 and OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: C:/msys64/usr/bin/pacman -S --noconfirm mingw-w64-ucrt-x86_64-SDL2 mingw-w64-ucrt-x86_64-openssl

      - name: Add UCRT64 toolchain to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.4.0

      - name: Initialize arduino-cli sketchbook
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        working-directory: tests
        run: uv sync

      - name: Run pytest
        working-directory: tests
        run: uv run pytest -v --html=report.html --self-contained-html

      - name: Upload graphics output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-output-${{ matrix.os }}
          path: tests/graphics/**/output/**
          if-no-files-found: ignore

      - name: Upload pytest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.os }}
          path: tests/report.html
          if-no-files-found: ignore
