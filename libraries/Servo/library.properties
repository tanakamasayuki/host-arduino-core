sentence=Host Servo that drives a 50 Hz LEDC PWM channel, so servo pulses reach the analog/PWM observation hook.
paragraph=Links and runs on host-arduino-core with the Arduino Servo API (attach, write, writeMicroseconds, read, readMicroseconds, attached, detach). attach() is an ledcAttach at 50 Hz and 16-bit resolution, write() is an ledcWrite of the pulse width as duty, detach() is an ledcDetach, so every step is reported through HostArduino::setAnalogWriteHook. No motor is modelled.
category=Device Control
