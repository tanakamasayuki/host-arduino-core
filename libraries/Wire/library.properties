sentence=Host I2C that initializes successfully with no device present, plus transaction-level and lifecycle observation hooks.
paragraph=Links and runs on host-arduino-core. Without a hook, endTransmission() reports an address NACK and requestFrom() returns 0 bytes. Register a write/read hook to put a library-side device model on the bus, and a lifecycle hook to see begin()/end()/setPins/setClock/setTimeOut in call order. See cores/host/HostBus.h for the GPIO and analog/PWM halves of the same port.
category=Communication
