sentence=Host SPI with byte-level, transaction and lifecycle observation hooks.
paragraph=Links and runs on host-arduino-core. Transferred bytes are handed to a transfer hook whose return value becomes the byte the sketch reads back, so a library can keep its own device model and watch the whole conversation. A lifecycle hook reports begin()/end() and the configuration setters in call order. See cores/host/HostBus.h for the GPIO and analog/PWM halves of the same port.
